<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoCitizens Study Launcher</title><style>body{font-family:system-ui,sans-serif;background:#f4f8f5;color:#14251d;margin:0}.wrap{max-width:720px;margin:50px auto;padding:24px}.card{background:white;border:1px solid #d7e5dc;border-radius:18px;padding:24px}h1{color:#0D3D2A}label{display:block;margin:14px 0;font-weight:600}input,select{display:block;width:100%;box-sizing:border-box;margin-top:6px;border:1px solid #cadbd0;border-radius:10px;padding:11px;font:inherit}button{border:0;border-radius:11px;background:#0D3D2A;color:white;padding:12px 18px;font-weight:700;cursor:pointer}.link{margin-top:18px;padding:12px;background:#e8f5ee;border-radius:10px;word-break:break-all;font-family:monospace;font-size:13px}</style></head><body><div class="wrap"><div class="card"><h1>GeoCitizens study launcher</h1><p>Create an anonymous participant link. Do not use participant names.</p><label>Participant code<input id="participant" value="P001"></label><label>Condition<select id="condition"><option value="multi_candidate">Multiple repair candidates</option><option value="single_candidate">Single repair candidate</option></select></label><button id="open">Open study session</button><div id="link" class="link"></div></div></div><script>function build(){const p=encodeURIComponent(document.getElementById('participant').value.trim()||'anonymous'),c=encodeURIComponent(document.getElementById('condition').value),u=`${location.origin}/?study=1&participant=${p}&condition=${c}`;document.getElementById('link').textContent=u;return u}document.getElementById('participant').addEventListener('input',build);document.getElementById('condition').addEventListener('change',build);document.getElementById('open').addEventListener('click',()=>location.href=build());build();</script></body></html>
