services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geocitizens
      POSTGRES_USER: geocitizens
      POSTGRES_PASSWORD: geocitizens
    ports:
      - "5432:5432"
    volumes:
      - geocitizens_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geocitizens -d geocitizens"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://geocitizens:geocitizens@db:5432/geocitizens
      ACTIVE_LEARNING_ALPHA: "0.08"
    ports:
      - "5050:5050"
    depends_on:
      db:
        condition: service_healthy

volumes:
  geocitizens_postgres:
